name: 🐳 Docker Compose Example CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flisk-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  doctor:
    name: 🩺 Flisk doctor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Tilt
        run: curl -fsSL https://raw.githubusercontent.com/tilt-dev/tilt/master/scripts/install.sh | bash
      - name: Install Flisk
        run: npm install --global @flisk-sh/flisk@latest
      - name: Run flisk doctor
        run: flisk doctor --no-ping

  e2e:
    name: 🐳 Docker Compose project setup E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the Flisk container
        run: docker compose build flisk
      - name: Verify Flisk runs in Docker Compose
        run: docker compose run --rm flisk flisk --version
      - name: Generate a project and resources in the mounted workspace
        shell: bash
        run: |
          docker compose run --rm flisk flisk project --yes
          # The container runs as root, so the generated .env is root-owned and
          # docker compose cannot read it on the host for the next command.
          sudo chown -R "$(id -u):$(id -g)" .
          printf '\n' | docker compose run --rm -T flisk flisk resource database --type backend --stack pre-alpha --path services/pre-alpha/database
          printf '\n' | docker compose run --rm -T flisk flisk resource api --type backend --stack pre-alpha --path services/pre-alpha/api
      - name: Verify generated project configuration
        run: docker compose run --rm flisk flisk project --check
